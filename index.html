<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey.com | Earn Through Knowledge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:url("https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;
overflow-x:hidden;

}

body::before{

content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
backdrop-filter:blur(3px);
z-index:-1;

}

header{

width:100%;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);

}

.logo{

font-size:28px;
font-weight:700;
color:#fff;

}

nav a{

color:white;
text-decoration:none;
margin-left:20px;
font-weight:500;
transition:.3s;

}

nav a:hover{

color:#FFD54F;

}

section{

display:none;
min-height:100vh;
padding:40px 8%;
justify-content:center;
align-items:center;

}

section.active{

display:flex;

}

.hero{

width:100%;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:40px;

}

.hero-text{

flex:1;
min-width:300px;

}

.hero-text h1{

font-size:58px;
color:white;
line-height:1.2;

}

.hero-text h1 span{

color:#FFD54F;

}

.hero-text p{

color:white;
font-size:18px;
margin-top:20px;
line-height:1.8;

}

.btn-group{

margin-top:30px;

}

.btn{

padding:14px 35px;
border:none;
border-radius:40px;
cursor:pointer;
font-size:16px;
font-weight:600;
transition:.4s;
margin-right:10px;

}

.primary{

background:#ff4d4d;
color:white;

}

.primary:hover{

transform:translateY(-4px);
box-shadow:0 10px 25px rgba(255,0,0,.4);

}

.secondary{

background:white;
color:#222;

}

.secondary:hover{

background:#FFD54F;

}

.card{

flex:1;
min-width:350px;
max-width:430px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(16px);
padding:35px;
border-radius:25px;
border:1px solid rgba(255,255,255,.2);
box-shadow:0 15px 40px rgba(0,0,0,.4);

}

.card h2{

color:white;
text-align:center;
margin-bottom:20px;

}

.input-box{

margin-bottom:18px;

}

.input-box label{

display:block;
color:white;
margin-bottom:8px;

}

.input-box input{

width:100%;
padding:14px;
border-radius:12px;
border:none;
outline:none;
font-size:15px;

}

.submit{

width:100%;
padding:15px;
background:#ff4d4d;
color:white;
border:none;
border-radius:30px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

.submit:hover{

background:#ff2222;

}

.links{

margin-top:20px;
text-align:center;

}

.links a{

color:#FFD54F;
text-decoration:none;
font-size:14px;

}

.links p{

color:white;
margin-top:10px;

}

.contact{

margin-top:35px;
color:white;
font-size:15px;
line-height:2;

}

footer{

background:rgba(0,0,0,.6);
text-align:center;
padding:20px;
color:white;

}

@media(max-width:900px){

.hero{

flex-direction:column;
text-align:center;

}

.hero-text h1{

font-size:42px;

}

.card{

width:100%;

}

nav{

display:none;

}

}
